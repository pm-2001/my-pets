name: Publish to npm

# Publish straight from the browser: create a GitHub Release (Releases → Draft a
# new release → choose a tag like v0.1.0 → Publish). This workflow then builds on
# a macOS runner — needed for the Swift helper — and runs `npm publish`.
#
# One-time setup: create an npm access token (npmjs.com → Access Tokens →
# Generate → Automation), then add it to this repo as a secret named NPM_TOKEN
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).
on:
  release:
    types: [published]
  # Also runnable by hand from the Actions tab.
  workflow_dispatch:

jobs:
  publish:
    # macOS so swiftc/lipo are available to build the universal deskscan helper.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # `npm publish` runs prepublishOnly (typecheck + build) before uploading.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
