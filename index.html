<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>desktop-pet</title>
    <style>
      /* The overlay must be fully transparent and never capture scroll or
         selection — it sits on top of the user's entire desktop. */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
